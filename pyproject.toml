[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "ur5-lerobot-capture"
version = "0.1.0"
description = "Config-driven UR5/SpaceMouse/three-view RGB capture for LeRobot v3"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "huggingface-hub>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
replay = ["rerun-sdk==0.33.1"]
preview = ["opencv-python>=4.10,<5"]
hardware = ["ur-rtde>=1.6,<2", "pyspacemouse==2.0.0", "pyrealsense2>=2.55,<2.57; sys_platform == 'linux'"]
test = ["pytest>=8,<9", "ruff>=0.9"]

[project.scripts]
ur5-capture = "ur5_capture.cli:main"
ur5-convert = "ur5_capture.convert:main"
ur5-replay = "ur5_capture.replay:main"
ur5-preview = "ur5_capture.preview:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["src/ur5_capture/_rtde"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
