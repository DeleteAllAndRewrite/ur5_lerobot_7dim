# Paths are relative to this project's root, not the terminal's working directory.
mode: real
dataset:
  repo_id: local/ur5_three_rgb
  root: datasets/ur5_three_rgb
  fps: 30
  task: Pick up the object and place it in the target area
  episodes: 100
  episode_seconds: 300.0
  image_writer_threads: 6
  vcodec: h264
robot:
  # 机器人连接
  ip: 192.168.100.100
  controller: cb3             # UR5 CB3: 125 Hz; UR5e: e_series up to 500 Hz
  motion_backend: ur_rtde   # Direct ur_rtde control; do not run ur_robot_driver
  ur_cap_port: 50002        # Must match External Control URCap server port
  # 控制频率
  control_hz: 125
  # 是否允许真实运动
  motion_enabled: true       # 测试tcp连接时 false 正式使用 ture
  tcp_offset: [0, 0, 0, 0, 0, 0]   # 安装夹爪后修改法兰盘偏移 [x, y, z, rx, ry, rz]
  tcp_configured: true
  # servol控制参数
  lookahead_time: 0.1
  gain: 300
  # 安全保护
  max_tracking_translation: 0.03
  max_tracking_rotation: 0.2
  command_timeout_s: 0.15
  # workspace
  watchdog_hz: 10.0
  workspace_min: [-1.00, -1.00, -0.50]
  workspace_max: [1.00, 1.00, 0.80]
  workspace_configured: true # 真实使用Ture
  mock_initial_pose: [0.30, 0.0, 0.30, 0.0, 3.141592653589793, 0.0]
teleop:
  device_index: 0
  deadzone: 0.12
  translation_axes: [0, 1, 2]  # device x,y,z,roll,pitch,yaw = indices 0..5
  rotation_axes: [3, 4, 5]
  translation_signs: [1, 1, 1]
  rotation_signs: [1, 1, 1]
  frame: base                # base or tool; saved action always expressed in base
  speed_toggle_button: 1     # press edge toggles low/high speed
  # spacemouse满偏 -> eef速度 = 比例 × (0.4 m/s, 1.0 rad/s)
  # 取值范围：0 < low_speed_ratio <= high_speed_ratio <= 2
  low_speed_ratio: 0.75     # 低速档：0.30 m/s, 0.75 rad/s
  high_speed_ratio: 2.00     # 高速档：0.40 m/s, 1.00 rad/s；设为 2 时为 0.80 m/s, 2.00 rad/s
  stale_timeout_s: 0.15
gripper:
  initial_grasp: 0           # 0=open (110 mm), 1=closed (0 mm); connect does not move
  toggle_button: 0           # press edge toggles commanded grasp; terminal g also works
  feedback_source: plugin   # REQUIRED for real 8D observation.state
  feedback_plugin: "ur5_capture.rg2:RTDEGripper"
  actuation_enabled: true  # 核对接线/开度/力后启用；切换目标时执行
  feedback_kwargs:
    robot_ip: "192.168.100.100" # UR5 控制器 IP；RG2 通过 RTDE 寄存器控制
    port: 30004
    max_width_mm: 110.0
    open_width_mm: 110.0
    close_width_mm: 0.0
    force_n: 20.0           # worker accepts 4..40 N
    poll_hz: 50.0
    socket_timeout_s: 0.2
    feedback_timeout_s: 0.25
    motion_timeout_s: 5.0
  # 状态后两维是实测原始总开度派生的 [w/2,-w/2]（米），不是两个独立编码器。
cameras:
  - name: agentview_1
    role: global
    serial: "039222250102" # 相机序列号
    width: 640
    height: 480
    fps: 30
  - name: agentview_2
    role: global
    serial: "043422252060"
    width: 640
    height: 480
    fps: 30
  - name: eye_in_hand
    role: eye_in_hand
    serial: "419522072783"
    width: 640
    height: 480
    fps: 30
synchronization:
  max_camera_skew_s: 0.040
  max_camera_age_s: 0.100
  max_robot_age_s: 0.050
  max_loop_lateness_s: 0.050
  startup_timeout_s: 10.0
