# 实机就绪模板（对照填写，别直接覆盖原配置）
# 用法：填完下面所有 <<< 必改 项后，改名或复制为 ur5_three_rgb.yaml，
#       再执行 ur5-capture validate --config <本文件> 自检。
# 关键顺序：先配 TCP/工作区/相机/夹爪（motion_enabled 保持 false），
#           最后才把 motion_enabled 改成 true。
mode: real
dataset:
  repo_id: local/ur5_three_rgb
  root: datasets/ur5_three_rgb
  fps: 30
  task: Pick up the object and place it in the target area
  episodes: 10
  episode_seconds: 30.0
  image_writer_threads: 6
  vcodec: h264
robot:
  ip: 192.168.1.10            # <<< 必改：你的 UR5 实际 IP，主机需可达
  controller: cb3             # <<< 必改：UR5=cb3，UR5e=e_series
  control_hz: 125             # CB3 上限 125，e_series 可更高
  motion_enabled: false       # <<< 最后一步：全部确认后改 true（record 强制要求）
  tcp_offset: [0, 0, 0, 0, 0, 0]  # <<< 必改：实测法兰->工具 TCP 偏移，m + 轴角 rad
  tcp_configured: false       # <<< 必改：完成 TCP 标定后改 true
  lookahead_time: 0.1
  gain: 300
  max_translation_speed: 0.05 # 线速度上限 m/s
  max_rotation_speed: 0.3     # 角速度上限 rad/s
  max_tracking_translation: 0.03
  max_tracking_rotation: 0.2
  command_timeout_s: 0.15
  watchdog_hz: 10.0
  workspace_min: [-0.60, -0.60, 0.10]  # <<< 必改：你的实际安全工作区，示例值不是安全边界
  workspace_max: [0.60, 0.60, 0.80]
  workspace_configured: false # <<< 必改：核实工作区后改 true
  mock_initial_pose: [0.30, 0.0, 0.30, 0.0, 3.141592653589793, 0.0]
teleop:
  device_index: 0
  deadzone: 0.12
  translation_axes: [0, 1, 2]  # 按需：核对 SpaceMouse 实际轴
  rotation_axes: [3, 4, 5]
  translation_signs: [1, 1, 1] # 按需：方向反了就填 -1
  rotation_signs: [1, 1, 1]
  frame: base                # base 或 tool
  deadman_button: 0          # 按住才动，松开停
  stop_button: 1
  stale_timeout_s: 0.15
gripper:
  initial_grasp: 0           # 0=开至 110 mm，1=闭至 0 mm；连接时不执行
  toggle_button: null       # 无空闲键就 null，终端按 g 切换
  feedback_source: plugin   # 实机固定 plugin
  feedback_plugin: "ur5_capture.rg2:RG2Gripper"
  actuation_enabled: false  # <<< 核实后改 true；执行仍要求按住 deadman
  feedback_kwargs:
    host: "192.168.1.1"     # <<< 必改：Compute Box IP；工具 I/O 直连旧 RG2 不适用
    port: 502
    unit_id: 65             # 单夹爪 65，双夹爪主/副 66/67
    max_width_mm: 110.0
    open_width_mm: 110.0
    close_width_mm: 0.0
    force_n: 20.0           # 3..40 N
    poll_hz: 50.0
    socket_timeout_s: 0.2
    feedback_timeout_s: 0.25
    motion_timeout_s: 5.0
cameras:
  - name: agentview_1
    role: global
    serial: REPLACE_CAMERA_SERIAL_1   # <<< 必改：纯数字序列号，务必加引号，如 "838212072841"
    width: 640
    height: 480
    fps: 30
  - name: agentview_2
    role: global
    serial: REPLACE_CAMERA_SERIAL_2   # <<< 必改
    width: 640
    height: 480
    fps: 30
  - name: eye_in_hand
    role: eye_in_hand
    serial: REPLACE_CAMERA_SERIAL_3   # <<< 必改
    width: 640
    height: 480
    fps: 30
synchronization:
  max_camera_skew_s: 0.040
  max_camera_age_s: 0.100
  max_robot_age_s: 0.050
  max_loop_lateness_s: 0.050
  startup_timeout_s: 10.0
